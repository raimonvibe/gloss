name: beautiful_words
description: Gloss — a lexicon of lovely language. Explore rare words, study their etymology, and quiz yourself.
publish_to: "none"
version: 1.0.0+12

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_tts: ^4.2.3
  font_awesome_flutter: ^11.0.0
  google_fonts: ^6.2.1
  intl: any
  provider: ^6.1.2
  share_plus: ^13.3.0
  shared_preferences: ^2.3.3
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_icon.png
  adaptive_icon_background: "#FAF3E3"
  adaptive_icon_foreground: assets/images/app_icon.png
  web:
    generate: true
    image_path: assets/images/app_icon.png
    background_color: "#faf3e3"
    theme_color: "#a9762f"
  linux:
    generate: true
    image_path: assets/images/app_icon.png

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/data/words.json
    - assets/images/
    - assets/l10n/
    - l10n/catalog.json
  fonts:
    - family: Tangerine
      fonts:
        - asset: assets/fonts/Tangerine-Regular.ttf
        - asset: assets/fonts/Tangerine-Bold.ttf
          weight: 700
